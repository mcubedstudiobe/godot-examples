<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Godot Examples</title>
  <desc id="desc">Small, complete Godot projects. Open one, press F5, take it apart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="0.55" stop-color="#102a46"/>
      <stop offset="1" stop-color="#173b63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#478cbf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#478cbf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- Accent orbits -->
  <circle cx="1010" cy="190" r="250" fill="none" stroke="#53e0f8" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="1010" cy="190" r="170" fill="none" stroke="#53e0f8" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- Title block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="94" fill="#53e0f8" font-size="22" font-weight="700" letter-spacing="5">M-CUBED STUDIO</text>
    <text x="68" y="200" fill="url(#titleFill)" font-size="92" font-weight="800" letter-spacing="-1">Godot</text>
    <text x="68" y="292" fill="url(#titleFill)" font-size="92" font-weight="800" letter-spacing="-1">Examples</text>
    <text x="72" y="350" fill="#c9d7e8" font-size="27">Small, complete projects. Open one,</text>
    <text x="72" y="386" fill="#c9d7e8" font-size="27">press <tspan fill="#ffffff" font-weight="700">F5</tspan>, take it apart.</text>
  </g>

  <!-- Scene tree card -->
  <g filter="url(#soft)">
    <rect x="770" y="70" width="440" height="300" rx="18" fill="#0d1726" stroke="#2b4a6e" stroke-width="2"/>
  </g>
  <rect x="770" y="70" width="440" height="46" rx="18" fill="#15253b"/>
  <rect x="770" y="98" width="440" height="18" fill="#15253b"/>
  <circle cx="798" cy="93" r="7" fill="#ff6b6b"/>
  <circle cx="822" cy="93" r="7" fill="#ffc861"/>
  <circle cx="846" cy="93" r="7" fill="#5ad39b"/>
  <g font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="19">
    <text x="874" y="99" fill="#7f97b5">res://example.tscn</text>

    <!-- tree lines -->
    <path d="M808 158V318M808 198H830M808 238H830M808 318H830M848 258V276H866" fill="none" stroke="#2f4d72" stroke-width="2"/>

    <rect x="794" y="136" width="18" height="18" rx="4" fill="#fc7f7f"/>
    <text x="822" y="152" fill="#e8f1fb">Example <tspan fill="#6d86a6">Node3D</tspan></text>

    <rect x="836" y="188" width="18" height="18" rx="9" fill="#53e0f8"/>
    <text x="864" y="204" fill="#e8f1fb">Player <tspan fill="#6d86a6">CharacterBody3D</tspan></text>

    <rect x="836" y="228" width="18" height="18" rx="4" fill="#ffc861"/>
    <text x="864" y="244" fill="#e8f1fb">Feedback <tspan fill="#6d86a6">Node</tspan></text>

    <rect x="874" y="268" width="16" height="16" rx="3" fill="#8fe08a"/>
    <text x="898" y="282" fill="#b8c8dc" font-size="17">tweens, particles, sound</text>

    <rect x="836" y="308" width="18" height="18" rx="4" fill="#b48cff"/>
    <text x="864" y="324" fill="#e8f1fb">Camera <tspan fill="#6d86a6">Camera3D</tspan></text>
  </g>

  <!-- Play badge -->
  <g filter="url(#soft)">
    <circle cx="1176" cy="356" r="44" fill="#478cbf"/>
  </g>
  <path d="M1163 334L1195 356L1163 378Z" fill="#ffffff"/>
</svg>
